[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "culprit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pytest>=8.2",
    "docxtpl>=0.16",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "uvicorn>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["brightcart/tests", "culprit/tests", "tests/incidents"]
norecursedirs = ["culprit/tests/fixtures"]
addopts = "-p no:cacheprovider"
